{% load i18n %}
<div class="himarket-filter-card p-2.5 rounded-2 bg-light border h-100 shadow-xs" data-filter-title="{{ title }}">
  <div class="fw-bold text-slate-800 fs-8 text-uppercase mb-2 d-flex align-items-center justify-content-between border-bottom pb-1.5">
    <span class="d-flex align-items-center gap-1.5">
      <i class="bi bi-funnel-fill text-primary" style="font-size: 0.8rem;"></i>
      <span>{{ title }}</span>
    </span>
    {% with choices|length as count %}
      <span class="badge bg-slate-200 text-slate-800 border border-slate-300 fs-9 fw-bold px-2 py-0.5">{{ count }} Seçenek</span>
    {% endwith %}
  </div>
  <div class="d-flex flex-wrap gap-1.5 mt-1">
  {% for choice in choices %}
    {% if choice.selected %}
      <a href="{{ choice.query_string|iriencode }}" class="btn btn-sm btn-primary active text-white fw-bold shadow-xs py-1 px-2.5 rounded-pill fs-8 text-decoration-none d-inline-flex align-items-center gap-1">
        <i class="bi bi-check2"></i> {{ choice.display }}
      </a>
    {% else %}
      <a href="{{ choice.query_string|iriencode }}" class="btn btn-sm btn-white bg-white border border-slate-300 text-slate-800 py-1 px-2.5 rounded-pill fs-8 fw-semibold text-decoration-none hover-shadow-sm">
        {{ choice.display }}
      </a>
    {% endif %}
  {% endfor %}
  </div>
</div>
